services:
  postgres:
    image: postgres:17-alpine
    container_name: shoptestlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shoptestlab
      POSTGRES_USER: shoptestlab
      POSTGRES_PASSWORD: shoptestlab
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes: { postgres_data: }
