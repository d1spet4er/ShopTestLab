services:
  app:
    build: .
    container_name: shoptestlab-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shoptestlab
      DB_USERNAME: shoptestlab
      DB_PASSWORD: shoptestlab
      JWT_SECRET: change-me-change-me-change-me-change-me-123456
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: shoptestlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shoptestlab
      POSTGRES_USER: shoptestlab
      POSTGRES_PASSWORD: shoptestlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoptestlab -d shoptestlab"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
