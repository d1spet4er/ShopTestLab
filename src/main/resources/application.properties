spring.application.name=shop-test-lab
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shoptestlab}
spring.datasource.username=${DB_USERNAME:shoptestlab}
spring.datasource.password=${DB_PASSWORD:shoptestlab}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
